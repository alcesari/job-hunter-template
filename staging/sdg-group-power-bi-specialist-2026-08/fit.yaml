    - "Modalità ibrida con possibilità di full remoto secondo location; compatibile con disponibilità al trasferimento/remoto del profilo"
    - "Azienda di consulenza dati con forte enfasi su formazione interna: coerente con profilo in fase di transizione di stack BI"

esito: valutato
note: "Fit buono su affinità di ruolo e contesto consulenziale; gap principale è la mancanza di esperienza diretta su Power BI, colmabile e da argomentare in cover letter."
