name: Mirror template branch to public repo

# Si attiva quando `template` riceve un push reale (tipicamente il merge
# della PR aperta da sync-template.yml). Fa un push lineare del contenuto
# già ripulito verso il `main` di una repo pubblica dedicata. Nessuna
# ricostruzione qui: `template` è già lo snapshot pulito approvato (scan
# fail-closed + revisione umana della PR) — questo workflow lo distribuisce
# soltanto, non lo genera.
#
# IMPORTANTE (vincolo GitHub Actions): il trigger `push: branches: [template]`
# legge la definizione del workflow dal branch `template` stesso al momento
# del push — se questo file venisse escluso dal template (come i file di
# tooling lato-main in templating/exclude-paths.txt), non scatterebbe MAI.
# Per questo il file vive volutamente su `template` (non è in
# exclude-paths.txt), e per questo la destinazione NON è hardcoded qui ma in
# una variabile di repository: così il file non porta alcuna identità
# personale e non serve escluderlo né genericizzarlo.
#
# CONFIGURAZIONE (repo privata, una tantum):
#   - Variabile di repository (non segreta) PUBLIC_TEMPLATE_REPO,
#     es. "tuo-utente/tuo-repo-template"
#   - Secret PUBLIC_TEMPLATE_REPO_TOKEN: fine-grained PAT con permesso
#     Contents: Read and write, scoped SOLO su quella repo pubblica
# Se PUBLIC_TEMPLATE_REPO non è impostata, il job si salta senza errore: chi
# clona il template senza voler mantenere un mirror pubblico non vede run
# falliti.

on:
  push:
    branches: [template]
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout template
        uses: actions/checkout@v4
        with:
          ref: template
          fetch-depth: 0
          # Senza questo, actions/checkout configura una credenziale globale
          # (http.https://github.com/.extraheader) col GITHUB_TOKEN della run,
          # che sovrascrive qualunque credenziale nell'URL del remote "public"
          # sotto — il push finirebbe autenticato come github-actions[bot]
          # (permesso negato sulla repo pubblica) invece che col nostro token.
          persist-credentials: false

      - name: Push verso la repo pubblica configurata
        env:
          TOKEN: ${{ secrets.PUBLIC_TEMPLATE_REPO_TOKEN }}
          TARGET_REPO: ${{ vars.PUBLIC_TEMPLATE_REPO }}
        run: |
          set -e
          if [ -z "${TARGET_REPO:-}" ]; then
            echo "Variabile di repository PUBLIC_TEMPLATE_REPO non impostata: nessun mirror pubblico configurato, salto senza errore."
            exit 0
          fi
          if [ -z "${TOKEN:-}" ]; then
            echo "ERRORE: PUBLIC_TEMPLATE_REPO è impostata ma manca il secret PUBLIC_TEMPLATE_REPO_TOKEN." >&2
            exit 1
          fi
          git remote add public "https://x-access-token:${TOKEN}@github.com/${TARGET_REPO}.git"
          git push public template:main
