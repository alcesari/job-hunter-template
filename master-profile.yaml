esperienze:
  - azienda: Earth Energy Srl
    ruolo: IT and Digital Solutions Manager
    settore: energy trading
    periodo:
      da: "2026-01"
      a: presente
    durata_mesi: 7
    tipo_ruolo: management
    descrizione: >-
      Unico riferimento IT dell'azienda, con responsabilità end-to-end su
      data engineering, applicazioni di business e infrastruttura. Sviluppa
      pipeline dati e script Python per l'operatività quotidiana (market
      data, position management). Ha contribuito al design e allo sviluppo
      della piattaforma di business intelligence per il desk di trading
      finanziario (modellazione e analisi dati su dashboard Streamlit).
      Ownership funzionale (non tecnica) di Business Central, con
      coordinamento di consulenti esterni su implementazione,
      customizzazione, integrazioni API e data ingestion. Guida un PoC in
      corso tra Microsoft Fabric e Google Cloud Platform per sostituire il
      reporting basato su Excel. Ha guidato da zero l'adozione AI
      aziendale.
    stack_e_strumenti: [Python, SQL, Business Central, Microsoft Fabric, Google Cloud Platform, BigQuery, Streamlit, Claude]
    responsabilita:
      - Ownership IT e infrastruttura dati
      - Sviluppo pipeline dati e automazioni Python
      - Design e sviluppo piattaforma BI per il desk di trading (Streamlit)
      - Ownership funzionale Business Central e coordinamento consulenti esterni
      - PoC piattaforma dati (Microsoft Fabric vs GCP)
      - Guida dell'adozione AI aziendale
    risultati_quantificabili:
      - "Da licenze Copilot mai utilizzate a primi agent Claude rilasciati e usati regolarmente nei processi aziendali"

  - azienda: GFT Technologies Srl
    ruolo: Junior Data Integration and BI Developer
    settore: consulenza IT
    periodo:
      da: "2023-04"
      a: "2025-12"
    durata_mesi: 33
    tipo_ruolo: individuale_tecnico
    descrizione: >-
      Primo lavoro a contratto. Tre progetti sullo stesso cliente bancario
      tier-1 (anonimo): due progetti ETL su IBM DataStage, Teradata e
      Hadoop (interrogato anche con Hive) — sviluppo e manutenzione dei
      software ETL a 360°: definizione dei requisiti tecnici, stesura della
      documentazione funzionale (AFU), controlli di data quality (census/
      mapping), sviluppo di job DataStage e relativa schedulazione (tool
      interno del cliente "Jade", TWS/IBM Tivoli Workload Scheduler come
      orchestratore), costruzione di viste SQL complesse, e attività di
      CI/CD e IAM con strumenti interni del cliente (portale di
      autorizzazione, tool di gestione rilasci); in alcuni task ha inoltre
      supervisionato e guidato il lavoro di colleghi neo-assunti, fornendo
      la formazione tecnica di base per il progetto. Un progetto separato
      di business intelligence su GCP (Looker/LookML, BigQuery), che ha
      incluso un task di performance tuning.
    stack_e_strumenti: [IBM DataStage, Teradata, Hadoop, Hive, Google BigQuery, Looker, LookML, TWS, Jade, SQL]
    responsabilita:
      - Sviluppo e manutenzione ETL a 360° (DataStage, Teradata, Hadoop/Hive)
      - Definizione requisiti tecnici e documentazione funzionale (AFU)
      - Controlli data quality (census/mapping)
      - Sviluppo job DataStage e schedulazione (Jade, TWS)
      - Costruzione viste SQL complesse
      - CI/CD e IAM con strumenti interni del cliente
      - Supervisione e formazione tecnica di colleghi neo-assunti (progetti ETL)
      - Sviluppo dashboard Looker/LookML per stakeholder C-level (progetto BI)
      - Performance tuning viste BigQuery (progetto BI)
    risultati_quantificabili:
      - "Refactoring della vista BigQuery della dashboard di data quality: tempo di rendering ridotto da oltre 10 minuti a meno di 1 minuto"
      - "Nei progetti ETL, ha supervisionato e guidato il lavoro di colleghi neo-assunti, occupandosi della loro formazione tecnica di base sul progetto"

